# /etc/nginx/sites-available/amflipbook
# Reverse proxy for amflipbook.amcloth.com -> Node on 127.0.0.1:4000.
# Run `sudo certbot --nginx -d amflipbook.amcloth.com` afterwards; certbot adds
# the HTTPS server block and the HTTP -> HTTPS redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name amflipbook.amcloth.com;

    # One upload = all page images (+ the PDF). 200 high-quality pages can
    # reach a few hundred MB.
    client_max_body_size 300m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Slow phone uploads and large flipbook downloads.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
